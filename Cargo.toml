[package]
name = "serialx"
version = "0.0.1"
edition = "2024"
description = "A polished serial port workspace built with GPUI"
license = "GPL-3.0-only"

[dependencies]
gpui-kit = "0.6"
regex = "1"
reqwest = { package = "gpui-pre-reqwest", version = "0.12.15", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serialport = "4.8"
smol = "2"
sys-locale = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.release]
lto = "thin"
strip = true

# `block` 0.1.6 (via gpui-kit's macOS stack) declares an `extern` static of an
# uninhabited type, which rustc warns will become a hard error. Upstream has
# not released a fix, so `vendor/block` carries the one-line change; see its
# README. Remove once the dependency chain no longer pulls the crate in.
[patch.crates-io]
block = { path = "vendor/block" }
