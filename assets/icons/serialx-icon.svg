<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Serial X application icon</title>
  <desc id="desc">A custom four-wing X monogram with mirrored UART waveforms on a deep graphite background.</desc>

  <defs>
    <clipPath id="tx-wave-clip">
      <path d="M172 210 380 210 516 382 430 468Z"/>
    </clipPath>
    <clipPath id="rx-top-clip">
      <path d="M846 206 646 258 532 414Q516 434 530 458L574 514 642 424Z"/>
    </clipPath>
    <clipPath id="rx-bottom-clip">
      <path d="M178 818 378 766 492 610Q508 590 494 566L450 510 382 600Z"/>
    </clipPath>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="218" fill="#17191F"/>

  <!-- RX wings: preserve the original tapered width, position, and curved shoulders. -->
  <g fill="#35B873">
    <path d="M846 206 646 258 532 414Q516 434 530 458L574 514 642 424Z"/>
    <path d="M178 818 378 766 492 610Q508 590 494 566L450 510 382 600Z"/>
  </g>
  <!-- Facets are clipped to the original silhouettes to remove subpixel protrusions. -->
  <path d="M846 206 646 258 604 318 770 276Z" fill="#73DEA2" clip-path="url(#rx-top-clip)"/>
  <path d="M178 818 378 766 420 706 254 748Z" fill="#73DEA2" clip-path="url(#rx-bottom-clip)"/>

  <!-- TX wings: solid tapered forms with no inset channel or dark cutout. -->
  <g fill="#4D75FF">
    <path d="M172 210 380 210 516 382 430 468Z"/>
    <path d="M852 814 644 814 508 642 594 556Z"/>
  </g>
  <g fill="#7695FF">
    <path d="M172 210 380 210 420 260 222 260Z"/>
    <path d="M852 814 644 814 604 764 802 764Z"/>
  </g>

  <!-- A compact UART high/low waveform communicates timed serial transmission. -->
  <g clip-path="url(#tx-wave-clip)" transform="rotate(45 360 360)" fill="none"
     stroke-linecap="square" stroke-linejoin="miter">
    <path d="M250 374H294V338H338V374H382V338H426V374H474"
          stroke="#F4F3EF" stroke-width="22"/>
    <!-- One highlighted interval is the active transmitted pulse. -->
    <path d="M338 374H382" stroke="#FF754C" stroke-width="24"/>
  </g>

  <!-- The matching receive-side waveform is an exact 180-degree mirror. -->
  <g transform="rotate(180 512 512)">
    <g clip-path="url(#tx-wave-clip)" transform="rotate(45 360 360)" fill="none"
       stroke-linecap="square" stroke-linejoin="miter">
      <path d="M250 374H294V338H338V374H382V338H426V374H474"
            stroke="#F4F3EF" stroke-width="22"/>
      <path d="M338 374H382" stroke="#FF754C" stroke-width="24"/>
    </g>
  </g>
</svg>
