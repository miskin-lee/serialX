[package]
name = "serialx"
version = "0.0.1"
edition = "2024"
description = "A polished serial port workspace built with GPUI"
license = "GPL-3.0-only"

[dependencies]
gpui-kit = "0.6"
reqwest = { package = "gpui-pre-reqwest", version = "0.12.15", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serialport = "4.8"
smol = "2"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.release]
lto = "thin"
strip = true
